name: build-dz-triton-nonprod

# Nonprod/demo variant of the dz-triton image → ghcr.io/datazoode/dz-triton
# tagged `:main-devtoken` (+ `:<sha>-devtoken`). IDENTICAL to build-dz-triton.yml
# except it passes `--build-arg DEV_TOKEN=dev-token`, so the `dev-token` Cargo
# feature is compiled IN (deploy/triton/Dockerfile already supports this ARG).
#
# Why: production `:main` is built `--no-default-features` (dev-token compiled
# out, ADR-10 / FR-I-5). But the nonprod substrate's dz-triton runs in dev-token
# mode — no OIDC issuer, no forwarded-auth — and its browser SPAs
# (dz-triton-explorer, herkules-web) authenticate with `Bearer dev-token`. Those
# SPAs 401 against a production `:main`. This image keeps the dev-token
# affordance for nonprod ONLY, on a DISTINCT tag so production `:main` stays
# hardened. The accepted token defaults to the literal `dev-token`
# (DEFAULT_DEV_TOKEN); a deploy MAY override via TRITON_DEV_TOKEN (empty = kill
# switch). NEVER point a production/public deploy at a `-devtoken` tag.
#
# workflow_dispatch only (re-run after a triton update to refresh the nonprod
# image with the latest fixes); the production build-dz-triton.yml is unchanged.

on:
  workflow_dispatch:

concurrency:
  group: build-dz-triton-nonprod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write # push the image to ghcr.io (GAR retired, Phase 5)
  contents: read

jobs:
  build:
    name: build + push dz-triton (nonprod, dev-token)
    runs-on: ubuntu-latest
    # cargo build --release -p triton-bin from scratch; 60m gives margin.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          GHCR="ghcr.io/datazoode/dz-triton"
          SHORT="${GITHUB_SHA::12}"
          # Distinct `-devtoken` tags so the nonprod affordance can NEVER be
          # pulled by a deploy that meant to use the hardened production image.
          TAGS="${GHCR}:${SHORT}-devtoken"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${GHCR}:main-devtoken"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Pushing: ${TAGS}"

      # Persist the Dockerfile's BuildKit cache mounts across runs.
      #
      # The layer cache above only caches LAYERS. `RUN --mount=type=cache`
      # contents are not layers, so the GHA backend drops them and every run
      # gets an empty cargo registry + target dir. Measured on this workspace,
      # rebuilding after a `crates/**` change (the only change that triggers
      # this workflow, so it is the case that matters):
      #
      #   cold, no cache at all .................. 5m35s
      #   layer cache only, mounts empty ......... 2m16s
      #   layer cache + mounts populated ........... 38s
      #
      # The layer cache alone recovers the base image and apt layers; the
      # mounts are what stop cargo recompiling the dependency tree. Hence the
      # dance: it extracts the mounts to disk after the build and injects them
      # back before the next one, with actions/cache carrying them between.
      #
      # If this ever misbehaves, deleting these two steps is safe and leaves
      # the 2m16s layer-cache behaviour intact.
      - name: Cache the cargo mounts used inside the build
        uses: actions/cache@v4
        id: cargo_mounts
        with:
          path: |
            docker-cargo-registry
            docker-cargo-git
            docker-cargo-target
          key: docker-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            docker-cargo-${{ runner.os }}-

      - name: Inject the cargo mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        with:
          cache-map: |
            {
              "docker-cargo-registry": "/usr/local/cargo/registry",
              "docker-cargo-git": "/usr/local/cargo/git",
              "docker-cargo-target": "/src/target"
            }
          skip-extraction: ${{ steps.cargo_mounts.outputs.cache-hit }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/triton/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Opt the dev-token affordance back in for nonprod (see the Dockerfile
          # ARG DEV_TOKEN). Production build-dz-triton.yml omits this → hardened.
          build-args: |
            DEV_TOKEN=dev-token
          provenance: false
          # Layer cache across runs. Without this every merge to main rebuilt
          # the image from scratch — 222s, essentially all of it recompiling
          # the Rust dependency tree that had not changed.
          #
          # `mode=max` caches intermediate stages too, not just the final
          # image, which is what makes the multi-stage build's `build` layer
          # reusable at all.
          cache-from: type=gha,scope=dz-triton-nonprod
          cache-to: type=gha,mode=max,scope=dz-triton-nonprod
