name: build-dz-triton-explorer

# Self-contained image build for the Triton Explorer Flutter SPA →
# ghcr.io/datazoode/dz-triton-explorer (GAR retired, Phase 5). Multi-stage
# Flutter web build → nginx (apps/explorer/deploy/Dockerfile). Same ghcr
# pattern as build-dz-triton.yml. We do NOT open the manifest-bump PR;
# `/release-app dz-triton-explorer <env>` resolves the latest :main SHA and
# opens it against the substrate repo.

on:
  push:
    branches: [main]
  # NO `paths:` filter, deliberately.
  #
  # GitHub applies `paths:` to every push in the same block, tag pushes
  # included — so with a filter here a `v*` release image only got built when
  # the tagged commit happened to touch one of the filtered paths. Release
  # builds were a coin flip on what the last commit changed.
  #
  # It cannot be fixed by splitting the tag trigger into a second `push:` key:
  # YAML keeps only the last duplicate key, which silently drops the branch
  # trigger entirely. The choices are a second workflow file (duplicating the
  # whole build block) or no filter. datazoo-agent-template hit this and chose
  # no filter.
  #
  # No filter is now cheap: with the layer cache + BuildKit cache mounts, a
  # main push whose sources did not change rebuilds in ~42s (measured, run
  # 33302437693), against 92s when crates/ did change and 222s before any
  # caching. Paying ~42s on an unrelated push buys a release trigger that
  # always fires.
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-dz-triton-explorer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write # push the image to ghcr.io (GAR retired, Phase 5)
  contents: read

jobs:
  build:
    name: build + push dz-triton-explorer
    runs-on: ubuntu-latest
    # flutter pub get + flutter build web --release; 45m is ample margin.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          GHCR="ghcr.io/datazoode/dz-triton-explorer"
          SHORT="${GITHUB_SHA::12}"
          TAGS="${GHCR}:${SHORT}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${GHCR}:main"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="${TAGS},${GHCR}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Pushing: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/explorer/deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          # Layer cache across runs. Without this every merge to main rebuilt
          # the image from scratch — 222s, essentially all of it recompiling
          # the Rust dependency tree that had not changed.
          #
          # `mode=max` caches intermediate stages too, not just the final
          # image, which is what makes the multi-stage build's `build` layer
          # reusable at all.
          cache-from: type=gha,scope=dz-triton-explorer
          cache-to: type=gha,mode=max,scope=dz-triton-explorer
