name: build-dz-triton

# Self-contained image build for the Triton agent-ingress gateway →
# ghcr.io/datazoode/dz-triton (GAR retired, Phase 5). Built here (not the
# substrate's reusable build-app-image.yml) because that workflow's cross-repo
# reuse is disabled (access=none); this mirrors DataZooDE/datazoo-agent-template's
# build-agent-template.yml. We do NOT open the manifest-bump PR (cross-repo
# write); `/release-app dz-triton-api <env>` resolves the latest :main SHA
# from ghcr and opens the manifest PR against the substrate repo.
#
# No operator prerequisites: GITHUB_TOKEN has packages:write on the org's
# ghcr namespace — no WIF, no static cloud keys, no GAR→ghcr mirror.

on:
  push:
    branches: [main]
  # NO `paths:` filter, deliberately.
  #
  # GitHub applies `paths:` to every push in the same block, tag pushes
  # included — so with a filter here a `v*` release image only got built when
  # the tagged commit happened to touch one of the filtered paths. Release
  # builds were a coin flip on what the last commit changed.
  #
  # It cannot be fixed by splitting the tag trigger into a second `push:` key:
  # YAML keeps only the last duplicate key, which silently drops the branch
  # trigger entirely. The choices are a second workflow file (duplicating the
  # whole build block) or no filter. datazoo-agent-template hit this and chose
  # no filter.
  #
  # No filter is now cheap: with the layer cache + BuildKit cache mounts, a
  # main push whose sources did not change rebuilds in ~42s (measured, run
  # 33302437693), against 92s when crates/ did change and 222s before any
  # caching. Paying ~42s on an unrelated push buys a release trigger that
  # always fires.
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-dz-triton-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write # push the image to ghcr.io (GAR retired, Phase 5)
  contents: read

jobs:
  build:
    name: build + push dz-triton
    runs-on: ubuntu-latest
    # cargo build --release -p triton-bin from scratch; 60m gives margin.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          GHCR="ghcr.io/datazoode/dz-triton"
          SHORT="${GITHUB_SHA::12}"
          TAGS="${GHCR}:${SHORT}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${GHCR}:main"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="${TAGS},${GHCR}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Pushing: ${TAGS}"

      # Persist the Dockerfile's BuildKit cache mounts across runs.
      #
      # The layer cache above only caches LAYERS. `RUN --mount=type=cache`
      # contents are not layers, so the GHA backend drops them and every run
      # gets an empty cargo registry + target dir. Measured on this workspace,
      # rebuilding after a `crates/**` change (the only change that triggers
      # this workflow, so it is the case that matters):
      #
      #   cold, no cache at all .................. 5m35s
      #   layer cache only, mounts empty ......... 2m16s
      #   layer cache + mounts populated ........... 38s
      #
      # The layer cache alone recovers the base image and apt layers; the
      # mounts are what stop cargo recompiling the dependency tree. Hence the
      # dance: it extracts the mounts to disk after the build and injects them
      # back before the next one, with actions/cache carrying them between.
      #
      # If this ever misbehaves, deleting these two steps is safe and leaves
      # the 2m16s layer-cache behaviour intact.
      - name: Cache the cargo mounts used inside the build
        uses: actions/cache@v4
        id: cargo_mounts
        with:
          path: |
            docker-cargo-registry
            docker-cargo-git
            docker-cargo-target
          key: docker-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            docker-cargo-${{ runner.os }}-

      - name: Inject the cargo mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        with:
          cache-map: |
            {
              "docker-cargo-registry": "/usr/local/cargo/registry",
              "docker-cargo-git": "/usr/local/cargo/git",
              "docker-cargo-target": "/src/target"
            }
          skip-extraction: ${{ steps.cargo_mounts.outputs.cache-hit }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/triton/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          # Layer cache across runs. Without this every merge to main rebuilt
          # the image from scratch — 222s, essentially all of it recompiling
          # the Rust dependency tree that had not changed.
          #
          # `mode=max` caches intermediate stages too, not just the final
          # image, which is what makes the multi-stage build's `build` layer
          # reusable at all.
          cache-from: type=gha,scope=dz-triton
          cache-to: type=gha,mode=max,scope=dz-triton
