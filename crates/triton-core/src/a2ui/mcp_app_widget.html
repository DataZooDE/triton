<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Answer</title>
<style>
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, #ffffff);
  --bg2: var(--color-background-secondary, #f4f5f7);
  --fg: var(--color-text-primary, #1d1f23);
  --muted: var(--color-text-secondary, #5f6570);
  --line: var(--color-border-primary, #e2e4e8);
  --accent: #4f52b2;
  --accent-fg: #ffffff;
  --warn: #8a5a00;
  --warn-bg: #fff6e0;
  --bad: #b3261e;
  --bad-bg: #fdecea;
  --ok: #1e7b3c;
  --radius: var(--border-radius-md, 6px);
  --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
}
:root[data-theme="dark"] {
  --bg: var(--color-background-primary, #1f1f1f);
  --bg2: var(--color-background-secondary, #2a2a2a);
  --fg: var(--color-text-primary, #ececec);
  --muted: var(--color-text-secondary, #a5a8ad);
  --line: var(--color-border-primary, #3a3b3e);
  --accent: #7f85f5;
  --accent-fg: #11121a;
  --warn: #f2c66d;
  --warn-bg: #3a2f14;
  --bad: #f28b82;
  --bad-bg: #3c1d1b;
  --ok: #7fd49a;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
body { font: 14px/1.45 var(--font); color: var(--fg); }
#card { padding: 14px 16px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
#card:empty { display: none; }
.head { display: flex; align-items: baseline; gap: 12px; }
.title { font-size: 16px; font-weight: 600; margin: 0; flex: 1; }
.stamp { color: var(--muted); font-size: 12px; white-space: nowrap; }
.context { color: var(--muted); margin: 2px 0 0; }
.block { margin-top: 12px; }
#card > .block:first-child { margin-top: 0; }
.block > .sub { font-weight: 600; margin: 0 0 6px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 4px 8px 6px 0; border-bottom: 1px solid var(--line); }
td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.act { cursor: pointer; }
tr.act:hover td, .row.act:hover { background: var(--bg2); }
tr.act:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.scroll { overflow-x: auto; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .main { flex: 1; min-width: 0; }
.row .detail { color: var(--muted); font-size: 13px; }
.row.act { cursor: pointer; }
.linkish { all: unset; cursor: pointer; display: block; width: 100%; }
.linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
dl.facts { display: grid; grid-template-columns: minmax(90px, max-content) 1fr; gap: 6px 16px; margin: 0; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; }
.before { color: var(--muted); text-decoration: line-through; }
.arrow { color: var(--muted); padding: 0 4px; }
.notice { display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--radius); background: var(--bg2); }
.notice.warn { background: var(--warn-bg); }
.notice.attention { background: var(--bad-bg); }
.notice .ic { font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; margin-top: 1px; background: var(--muted); color: var(--bg); }
.notice.warn .ic { background: var(--warn); }
.notice.attention .ic { background: var(--bad); }
.notice .nt { font-weight: 600; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { padding-left: 18px; }
.node { display: flex; align-items: baseline; gap: 6px; padding: 3px 0; }
.node .lbl { flex: 1; min-width: 0; }
.node .cnt { color: var(--muted); white-space: nowrap; }
.node .gap { color: var(--warn); font-size: 12px; }
.tw { all: unset; cursor: pointer; width: 14px; text-align: center; color: var(--muted); flex: none; }
.tw:focus-visible { outline: 2px solid var(--accent); border-radius: 3px; }
.bullet { width: 14px; text-align: center; color: var(--muted); flex: none; }
.nodechips { padding: 2px 0 4px 20px; }
.tree.only-gaps li.nogap { display: none; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.bar { margin-top: 14px; }
button.b { font: inherit; border-radius: var(--radius); padding: 6px 14px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--fg); }
button.b:hover { background: var(--bg2); }
button.b.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button.b.primary:hover { filter: brightness(1.08); }
button.b.small { padding: 2px 10px; font-size: 13px; }
button.b[aria-pressed="true"], button.b[aria-selected="true"] { background: var(--bg2); border-color: var(--muted); }
button.b:disabled { opacity: .55; cursor: default; }
button.b:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.field { margin-bottom: 10px; }
.field > label, .field > .lab { display: block; font-weight: 600; margin-bottom: 4px; }
.req { color: var(--bad); margin-left: 2px; }
select, input[type=text], input[type=number], textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; }
textarea { min-height: 56px; resize: vertical; }
select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.field > label.radio { display: flex; gap: 8px; align-items: center; padding: 3px 0; margin: 0; font-weight: 400; }
input[type=radio] { accent-color: var(--accent); margin: 0; }
.note, .preview { color: var(--muted); font-size: 13px; margin-top: 8px; }
.progressbar { height: 6px; border-radius: 3px; background: var(--bg2); overflow: hidden; margin-bottom: 8px; }
.progressbar > div { height: 100%; background: var(--accent); }
.step { display: flex; gap: 8px; padding: 2px 0; }
.step.pending { color: var(--muted); }
.step.active { font-weight: 600; }
.step .m { width: 14px; text-align: center; }
.step.done .m { color: var(--ok); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sent { color: var(--muted); font-size: 13px; padding: 6px 4px 0; }
.sent:empty { display: none; }
.sent.bad { color: var(--bad); }
.msg, .preview { white-space: pre-wrap; unicode-bidi: plaintext; }
.msg { display: block; color: var(--muted); font-size: 12px; font-weight: 400; overflow-wrap: break-word; }
/* A long unbroken string (an id, a URL-like value) wraps instead of
   widening the card or squeezing its neighbours. */
.title, .context, td, .row .main, .lbl, dd, .notice, .preview, .more { overflow-wrap: anywhere; min-width: 0; }
button.b.primary .msg { color: inherit; opacity: .8; }
.more { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
<main id="card"></main>
<div class="sent" id="status" role="status" aria-live="polite"></div>
<script>
(() => {
  "use strict";
  const DATA_VERSION = 1;
  const card = document.getElementById("card");
  const status = document.getElementById("status");
  let nextId = 1;
  const pending = new Map();
  let bridge = false;      // the MCP Apps host answered ui/initialize
  let canOpenLinks = true;

  // The widget's own words (the data brings its own, already localised).
  const WORDS = {
    en: { yes: "Yes", no: "No", send: "Send", gap: "gap", changesTo: "changes to",
          sent: "Sent", opened: "Opened", notSent: "Not sent — try again", notOpened: "Not opened — try again",
          willSend: "Will be sent", opens: "Opens ", more: (n) => "… " + n + " more",
          moreSections: (n) => "… " + n + " more sections", sending: "Sending…", opening: "Opening…" },
    de: { yes: "Ja", no: "Nein", send: "Senden", gap: "Lücke", changesTo: "ändert sich zu",
          sent: "Gesendet", opened: "Geöffnet", notSent: "Nicht gesendet – bitte erneut versuchen",
          notOpened: "Nicht geöffnet – bitte erneut versuchen",
          willSend: "Wird gesendet", opens: "Öffnet ", more: (n) => "… " + n + " weitere",
          moreSections: (n) => "… " + n + " weitere Abschnitte", sending: "Wird gesendet…", opening: "Wird geöffnet…" },
  };
  const t = (k) => (WORDS[document.documentElement.lang] || WORDS.en)[k];

  // ── host bridge (MCP Apps JSON-RPC over postMessage) ─────────────────
  const post = (msg) => window.parent.postMessage(msg, "*");
  const notify = (method, params) => post({ jsonrpc: "2.0", method, params: params || {} });
  // No timeout: a message or link request may wait on the user (a host
  // confirmation), and giving up on it would invite a second send; a slow
  // host's handshake answer must still count.
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    post({ jsonrpc: "2.0", id, method, params: params || {} });
  });

  window.addEventListener("message", (e) => {
    if (e.source !== window.parent) return;
    const d = e.data;
    if (!d || d.jsonrpc !== "2.0") return;
    if (d.id != null && !d.method) {
      const p = pending.get(d.id);
      if (p) { pending.delete(d.id); d.error ? p.reject(d.error) : p.resolve(d.result); }
      return;
    }
    switch (d.method) {
      case "ui/notifications/tool-result": fromResult(d.params); break;
      case "ui/notifications/host-context-changed": applyContext(d.params); break;
      case "ui/resource-teardown": post({ jsonrpc: "2.0", id: d.id, result: {} }); break;
      default: if (d.id != null && d.method) post({ jsonrpc: "2.0", id: d.id, error: { code: -32601, message: "not supported" } });
    }
  });

  let hostTheme = false;
  let shown = null; // the widget data on screen, for a re-render
  function applyContext(ctx) {
    if (!ctx) return;
    if (ctx.theme === "dark" || ctx.theme === "light") { hostTheme = true; document.documentElement.dataset.theme = ctx.theme; }
    const vars = ctx.styles && ctx.styles.variables;
    if (vars && typeof vars === "object") {
      for (const [k, v] of Object.entries(vars)) {
        if (/^--[a-z0-9-]+$/i.test(k) && typeof v === "string") document.documentElement.style.setProperty(k, v);
      }
    }
    if (ctx.locale) {
      const lang = String(ctx.locale).split(/[-_]/)[0];
      // The widget's own words follow a changed locale (a form starts over).
      if (lang !== document.documentElement.lang) {
        document.documentElement.lang = lang;
        if (shown) render(shown);
      }
    }
  }

  // The card's data: result `_meta` only (hidden from the model; both
  // reference hosts pass it). A result without it clears the card.
  const META_KEY = "triton/widget";
  const pick = (meta) => (meta && meta[META_KEY]) || null;
  function fromResult(r) {
    render(r ? pick(r._meta) : null);
  }

  // ChatGPT also hydrates window.openai; theme from there when present.
  function fromOpenAI() {
    const o = window.openai;
    if (!o) return;
    if (o.theme || o.locale) applyContext({ theme: o.theme, locale: o.locale });
    if (bridge) return; // the MCP Apps bridge delivers the result
    const m = o.toolResponseMetadata;
    const meta = m && (m._meta || (m.call_tool_result && m.call_tool_result._meta) || m);
    if (o.toolOutput !== undefined || m !== undefined) render(pick(meta));
  }
  window.addEventListener("openai:set_globals", fromOpenAI);

  // ── actions: one complete new message, or a deep link ────────────────
  // ONE transport per click: the bridge when the host answered the
  // handshake, else ChatGPT's window.openai. Never both — an unanswered
  // ui/message may still have been delivered.
  async function sendMessage(text) {
    if (bridge) {
      try {
        const r = await request("ui/message", { role: "user", content: [{ type: "text", text }] });
        return !(r && r.isError);
      } catch (_) { return false; }
    }
    if (window.openai && window.openai.sendFollowUpMessage) {
      try { await window.openai.sendFollowUpMessage({ prompt: text }); return true; } catch (_) { return false; }
    }
    return false;
  }
  // https with a host and no credentials (the server applies the same rule).
  const safeLink = (url) => {
    try {
      if (!/^https:\/\/[^\/\\]/.test(url)) return false;
      const u = new URL(url);
      return u.protocol === "https:" && !!u.hostname && !u.username && !u.password;
    } catch (_) { return false; }
  };
  async function openLink(url) {
    if (!safeLink(url)) return false;
    if (bridge && canOpenLinks) {
      try {
        const r = await request("ui/open-link", { url });
        return !(r && r.isError);
      } catch (_) { return false; }
    }
    if (window.openai && window.openai.openExternal) {
      try { await window.openai.openExternal({ href: url }); return true; } catch (_) { return false; }
    }
    // A host that answered the handshake without openLinks said no.
    if (bridge) return false;
    return !!window.open(url, "_blank");
  }
  // One request per control at a time: a control stays busy until the
  // host settles the request, plus a short cooldown, so a double click or
  // a held key cannot send the same complete request twice.
  const busy = new WeakSet();
  // The status line reports the latest click on the card it was made on:
  // a slower earlier click, or one from a card since replaced, stays quiet.
  let generation = 0, clicks = 0;
  const say = (text, bad) => { status.textContent = text; status.className = "sent" + (bad ? " bad" : ""); };
  async function run(action, ctl, idle) {
    if (!action || (ctl && busy.has(ctl))) return;
    const send = action.type === "send_message";
    const gen = generation, click = ++clicks;
    const focused = ctl && document.activeElement === ctl;
    if (ctl) { busy.add(ctl); ctl.setAttribute("aria-busy", "true"); if ("disabled" in ctl) ctl.disabled = true; }
    say(send ? t("sending") : t("opening"), false);
    let ok = false;
    try {
      if (send) ok = await sendMessage(action.text);
      else if (action.type === "open_url") ok = await openLink(action.url);
    } finally {
      if (ctl) setTimeout(() => {
        busy.delete(ctl);
        ctl.removeAttribute("aria-busy");
        if ("disabled" in ctl) ctl.disabled = false;
        if (idle) idle();
        // Disabling moved the focus to the page; give it back.
        if (focused && ctl.isConnected && (!document.activeElement || document.activeElement === document.body)) ctl.focus();
      }, 1200);
    }
    if (gen !== generation || click !== clicks) return;
    say(ok ? (send ? t("sent") : t("opened")) : (send ? t("notSent") : t("notOpened")), !ok);
  }

  // ── template: the producer's request, filled on the client ───────────
  // Parts: {text}, {field}, {optional:[…]}; an optional segment is kept
  // only when all its fields are non-blank; a blank required field blocks.
  // Rust's `str::trim` (Unicode White_Space), not JS `trim`: the two
  // differ on U+0085 and U+FEFF.
  const WS = "\\t\\n\\v\\f\\r \\u0085\\u00a0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000";
  const TRIM = new RegExp("^[" + WS + "]+|[" + WS + "]+$", "g");
  const trim = (x) => x.replace(TRIM, "");
  // `ph`, when given, stands in for a missing required field (the
  // preview); optional segments are decided by the real values alone.
  function fill(parts, values, ph) {
    const missing = [];
    const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
    const one = (list, out, miss) => {
      for (const p of list) {
        if (has(p, "text")) out.push(p.text);
        else if (has(p, "field")) {
          const raw = has(values, p.field) ? values[p.field] : null;
          const v = trim(raw == null ? "" : String(raw));
          if (v) out.push(v);
          else {
            if (!miss.includes(p.field)) miss.push(p.field);
            if (ph && out === top) out.push(ph(p.field));
          }
        }
      }
    };
    const out = [], top = out;
    for (const p of parts) {
      if (p.optional) {
        const o = [], m = [];
        one(p.optional, o, m);
        if (!m.length) out.push(...o);
      } else one([p], out, missing);
    }
    // Trimmed like the server-side `resolve` every other channel uses.
    return { text: trim(out.join("")), missing };
  }
  // Pure; exposed so a harness can run the shared fill vectors.
  window.tritonWidgetFill = fill;

  // The live preview (PD48): once the request is complete, exactly the
  // text a click sends; before that, the same text with each missing
  // required field as ‹its label› (an optional segment shows only when
  // complete, as it would be sent).
  function previewText(parts, values, labels) {
    return fill(parts, values, (f) => "‹" + (labels[f] || f) + "›").text;
  }

  // ── rendering ─────────────────────────────────────────────────────────
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : String(k));
    return n;
  }
  // What a control does beyond its label (PD48): a message that differs
  // from the label shows as a secondary line; a link names its host in the
  // tooltip and the accessible description, not in the visible label.
  const msgLine = (label, action) =>
    action && action.type === "send_message" && trim(String(action.text)) !== trim(String(label))
      ? el("span", { class: "msg" }, action.text) : null;
  const describe = (node, action) => {
    if (!action || action.type !== "open_url") return node;
    try {
      const host = new URL(action.url).host;
      node.title = host;
      node.setAttribute("aria-description", t("opens") + host);
    } catch (_) { /* not a link the widget opens anyway */ }
    return node;
  };
  const btn = (label, action, cls) => {
    const b = el("button", { type: "button", class: "b " + (cls || "") }, label, msgLine(label, action));
    describe(b, action);
    b.addEventListener("click", () => run(action, b));
    return b;
  };
  // "… N more" under a cut block, with the card's open link when it has one.
  // The open link once per card, with the first cut.
  let openAction = null, openShown = false;
  const more = (n, words) => {
    if (typeof n !== "number" || n <= 0) return null;
    const link = openAction && !openShown ? btn(openAction.label, openAction.action, "small") : null;
    if (link) openShown = true;
    return el("div", { class: "more" }, el("span", { class: "n" }, t(words || "more")(n)), link);
  };
  const activate = (node, action) => {
    describe(node, action);
    node.classList.add("act");
    node.tabIndex = 0;
    node.setAttribute("role", action.type === "open_url" ? "link" : "button");
    node.addEventListener("click", () => run(action, node));
    node.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      if (!e.repeat) run(action, node);
    });
  };
  const sub = (t) => t ? el("p", { class: "sub" }, t) : null;

  const blocks = {
    table(b) {
      const head = el("tr", {}, b.columns.map((c) => el("th", { scope: "col" }, c)));
      // An actionable row stays a table row (screen-reader table
      // navigation); its first cell holds the native control, and a click
      // anywhere on the row is that control's click.
      const rows = b.rows.map((r) => {
        const cells = r.cells.map((c, ci) => el("td", {}, r.action && ci === 0 ? describe(el("button", { type: "button", class: "linkish" }, c, msgLine(c, r.action)), r.action) : c));
        const tr = el("tr", {}, cells);
        if (r.action) {
          tr.classList.add("act");
          tr.addEventListener("click", () => run(r.action, tr));
        }
        return tr;
      });
      return [sub(b.title), el("div", { class: "scroll" }, el("table", {}, el("thead", {}, head), el("tbody", {}, rows))), more(b.more)];
    },
    list(b) {
      const items = b.items.map((it) => {
        const main = el("div", { class: "main" }, el("div", {}, it.label), it.detail ? el("div", { class: "detail" }, it.detail) : null);
        const li = el("li", { class: "row" }, main);
        if (it.action && it.action_label) li.append(btn(it.action_label, it.action, "small"));
        else if (it.action) { activate(li, it.action); main.append(msgLine(it.label, it.action) || ""); }
        return li;
      });
      return [sub(b.title), el("ul", { class: "rows" }, items), more(b.more)];
    },
    facts(b) {
      const dl = el("dl", { class: "facts" });
      for (const p of b.pairs) {
        dl.append(el("dt", {}, p.label), el("dd", {}, p.before ? [el("span", { class: "before" }, p.before), el("span", { class: "arrow", "aria-hidden": "true" }, "→"), el("span", { class: "sr" }, " " + t("changesTo") + " "), p.value] : p.value));
      }
      return [sub(b.title), dl, more(b.more)];
    },
    notice(b) {
      const mark = b.tone === "info" ? "i" : "!";
      return el("div", { class: "notice " + b.tone, role: b.tone === "attention" ? "alert" : null },
        el("span", { class: "ic", "aria-hidden": "true" }, mark),
        el("div", {}, b.title ? el("div", { class: "nt" }, b.title) : null, el("div", {}, b.text)));
    },
    progress(b) {
      const out = [sub(b.title)];
      if (typeof b.fraction === "number") {
        const pct = Math.round(b.fraction * 100);
        out.push(el("div", { class: "progressbar", role: "progressbar", "aria-valuenow": pct, "aria-valuemin": 0, "aria-valuemax": 100 }, el("div", { style: "width:" + pct + "%" })));
      }
      const marks = { done: "✓", active: "●", pending: "○" };
      out.push(el("ul", { class: "rows" }, b.steps.map((s) => el("li", { class: "step " + s.state }, el("span", { class: "m", "aria-hidden": "true" }, marks[s.state] || ""), s.label))));
      return out;
    },
    chips(b) {
      return [b.prompt ? el("p", { class: "sub" }, b.prompt) : null, el("div", { class: "btns" }, b.chips.map((c) => btn(c.label, c.action)))];
    },
    tree(b) {
      const gaps = new Map();
      const hasGap = (n) => {
        if (!gaps.has(n)) gaps.set(n, !!n.gap || (n.children || []).some(hasGap));
        return gaps.get(n);
      };
      const node = (n) => {
        const kids = n.children || [];
        const li = el("li", { class: hasGap(n) ? "" : "nogap" });
        const row = el("div", { class: "node" });
        let ul = null;
        if (kids.length || (n.chips && n.chips.length)) {
          const open = !!(n.expanded || n.gap);
          const tw = el("button", { type: "button", class: "tw", "aria-expanded": String(open), "aria-label": n.label }, open ? "▾" : "▸");
          ul = el("div", { hidden: !open });
          tw.addEventListener("click", () => {
            const o = tw.getAttribute("aria-expanded") !== "true";
            tw.setAttribute("aria-expanded", String(o)); tw.textContent = o ? "▾" : "▸"; ul.hidden = !o;
          });
          row.append(tw);
        } else row.append(el("span", { class: "bullet", "aria-hidden": "true" }, "•"));
        const lbl = el("span", { class: "lbl" }, n.label);
        // A caption of its own is its own control (as in a list); else the
        // label is the control.
        const caption = n.action && n.action_label && n.action_label !== n.label ? n.action_label : null;
        if (n.action && !caption) {
          lbl.replaceChildren(describe(el("button", { type: "button", class: "linkish" }, n.label, msgLine(n.label, n.action)), n.action));
          lbl.firstChild.addEventListener("click", () => run(n.action, lbl.firstChild));
        }
        row.append(lbl);
        if (caption) row.append(btn(caption, n.action, "small"));
        if (n.gap) row.append(el("span", { class: "gap" }, t("gap")));
        if (n.count) row.append(el("span", { class: "cnt" }, n.count));
        li.append(row);
        if (ul) {
          if (n.chips && n.chips.length) ul.append(el("div", { class: "btns nodechips" }, n.chips.map((c) => btn(c.label, c.action, "small"))));
          if (kids.length) ul.append(el("ul", {}, kids.map(node)));
          li.append(ul);
        }
        return li;
      };
      const tree = el("ul", { class: "tree" }, b.nodes.map(node));
      const out = [sub(b.title), tree, more(b.more)];
      if (b.gaps_toggle) {
        const t = el("button", { type: "button", class: "b small", "aria-pressed": "false" }, b.gaps_toggle);
        t.addEventListener("click", () => {
          const on = t.getAttribute("aria-pressed") !== "true";
          t.setAttribute("aria-pressed", String(on)); tree.classList.toggle("only-gaps", on);
          if (on) tree.querySelectorAll(".tw[aria-expanded=false]").forEach((x) => { if (!x.closest("li").classList.contains("nogap")) x.click(); });
        });
        out.push(el("div", { class: "btns", style: "margin-top:10px" }, t));
      }
      return out;
    },
    form(b, k) {
      const wrap = el("div", {});
      if (b.title) wrap.append(sub(b.title));
      const groups = b.groups || [];
      const panels = groups.map((g, gi) => formPanel(b, g, k + "-" + gi));
      if (groups.length > 1) {
        // The ARIA tabs pattern: one tab in the tab order, arrows/Home/End
        // move between tabs and select the one they land on.
        const tabs = el("div", { class: "tabs", role: "tablist" });
        const select = (gi) => {
          [...tabs.children].forEach((x, xi) => { x.setAttribute("aria-selected", String(xi === gi)); x.tabIndex = xi === gi ? 0 : -1; });
          panels.forEach((p, pi) => { p.hidden = pi !== gi; });
        };
        groups.forEach((g, gi) => {
          const tab = el("button", { type: "button", class: "b", role: "tab", id: "tab-" + k + "-" + gi, "aria-controls": "panel-" + k + "-" + gi }, g.label || String(gi + 1));
          tab.addEventListener("click", () => select(gi));
          tabs.append(tab);
        });
        tabs.addEventListener("keydown", (e) => {
          const n = groups.length, cur = [...tabs.children].indexOf(document.activeElement);
          if (cur < 0) return;
          const to = { ArrowRight: (cur + 1) % n, ArrowLeft: (cur + n - 1) % n, Home: 0, End: n - 1 }[e.key];
          if (to === undefined) return;
          e.preventDefault();
          select(to);
          tabs.children[to].focus();
        });
        wrap.append(tabs);
        panels.forEach((p, pi) => { p.id = "panel-" + k + "-" + pi; p.setAttribute("role", "tabpanel"); p.setAttribute("aria-labelledby", "tab-" + k + "-" + pi); });
        select(0);
      }
      wrap.append(...panels);
      return wrap;
    },
  };

  function formPanel(b, g, key) {
    const form = el("form", { novalidate: true });
    const getters = Object.create(null);
    g.fields.forEach((f, fi) => {
      const id = "f-" + key + "-" + fi;
      const label = [f.label, f.required ? el("span", { class: "req", "aria-hidden": "true" }, "*") : null];
      let box;
      if (f.kind === "select" && f.style === "radio") {
        const fs = el("fieldset", { class: "field", style: "border:0;padding:0;margin:0 0 10px" }, el("legend", { class: "lab", style: "font-weight:600;margin-bottom:4px;padding:0" }, label));
        (f.options || []).forEach((o, oi) => {
          fs.append(el("label", { class: "radio" }, el("input", { type: "radio", name: id, value: o.value, required: f.required, checked: f.default === o.value }), o.label));
        });
        getters[f.name] = () => { const c = fs.querySelector("input:checked"); return c ? c.value : ""; };
        box = fs;
      } else {
        let ctl;
        if (f.kind === "select") {
          ctl = el("select", { id, required: f.required }, el("option", { value: "" }, f.required ? "" : "—"), (f.options || []).map((o) => el("option", { value: o.value, selected: f.default === o.value }, o.label)));
        } else if (f.kind === "text") {
          ctl = el("textarea", { id, placeholder: f.placeholder, required: f.required }, f.default != null ? String(f.default) : "");
        } else if (f.kind === "boolean") {
          ctl = el("select", { id, required: f.required }, el("option", { value: "" }, ""), el("option", { value: "true", selected: f.default === true }, t("yes")), el("option", { value: "false", selected: f.default === false }, t("no")));
        } else {
          ctl = el("input", { id, type: f.kind === "integer" ? "number" : "text", placeholder: f.placeholder, required: f.required, value: f.default != null ? String(f.default) : null });
        }
        getters[f.name] = () => ctl.value;
        box = el("div", { class: "field" }, el("label", { for: id }, label), ctl);
      }
      form.append(box);
    });
    const values = () => {
      const v = Object.create(null);
      for (const k of Object.keys(getters)) v[k] = getters[k]();
      return v;
    };
    const submit = el("button", { type: "submit", class: "b primary" }, b.submit_label || t("send"));
    const labels = Object.create(null);
    for (const f of g.fields) labels[f.name] = f.label;
    const preview = el("div", { class: "preview" });
    // A request in flight keeps the submit disabled, whatever is edited.
    const sync = () => {
      const v = values();
      submit.disabled = busy.has(submit) || fill(g.template, v).missing.length > 0;
      preview.textContent = (g.preview_label || t("willSend")) + ": " + previewText(g.template, v, labels);
    };
    form.addEventListener("input", sync);
    form.addEventListener("change", sync);
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const r = fill(g.template, values());
      if (busy.has(submit)) return;
      if (r.missing.length || !r.text) { sync(); return; }
      run({ type: "send_message", text: r.text }, submit, sync);
    });
    form.append(preview, el("div", { class: "btns" }, submit));
    if (b.note) form.append(el("div", { class: "note" }, b.note));
    sync();
    return form;
  }

  function render(w) {
    card.replaceChildren();
    say("", false);
    generation++;
    shown = w;
    openAction = null;
    openShown = false;
    if (!w || typeof w !== "object" || w.version !== DATA_VERSION) { resize(); return; }
    if (w.header) {
      card.append(el("div", { class: "head" }, el("h1", { class: "title" }, w.header.title), w.header.stamp ? el("span", { class: "stamp" }, w.header.stamp) : null));
      if (w.header.context) card.append(el("p", { class: "context" }, w.header.context));
    }
    const acts = Array.isArray(w.actions) ? w.actions : [];
    openAction = acts.find((a) => a && a.action && a.action.type === "open_url") || null;
    (Array.isArray(w.body) ? w.body : []).forEach((b, k) => {
      if (!b || !Object.prototype.hasOwnProperty.call(blocks, b.type)) return;
      const sec = el("section", { class: "block" });
      try { sec.append(...[blocks[b.type](b, k)].flat().filter(Boolean)); } catch (_) { return; }
      card.append(sec);
    });
    const cut = more(w.more, "moreSections");
    if (cut) card.append(el("section", { class: "block" }, cut));
    if (acts.length) card.append(el("div", { class: "btns bar" }, acts.map((a) => btn(a.label, a.action, a.primary ? "primary" : ""))));
    resize();
  }

  // ── size: tell the host the height we need ────────────────────────────
  // Measured like the ext-apps SDK: the root at max-content, so a frame
  // the host already sized does not stretch the measurement.
  let lastH = -1;
  function resize() {
    const root = document.documentElement;
    const was = root.style.height;
    root.style.height = "max-content";
    const h = Math.ceil(root.getBoundingClientRect().height);
    root.style.height = was;
    if (h === lastH) return;
    lastH = h;
    if (bridge) notify("ui/notifications/size-changed", { width: Math.ceil(window.innerWidth), height: h });
    if (window.openai && window.openai.notifyIntrinsicHeight) window.openai.notifyIntrinsicHeight(h);
  }
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => requestAnimationFrame(resize));
    ro.observe(document.documentElement);
    ro.observe(document.body);
  }

  // ── start: handshake first; the host sends nothing before `initialized` ─
  const mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
  const systemTheme = () => { if (!hostTheme) document.documentElement.dataset.theme = mq && mq.matches ? "dark" : "light"; };
  systemTheme();
  if (mq && mq.addEventListener) mq.addEventListener("change", systemTheme);
  fromOpenAI();
  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "triton-answer-card", version: "1" },
    appCapabilities: { availableDisplayModes: ["inline"] },
  }).then((r) => {
    bridge = true;
    r = r || {};
    canOpenLinks = !r.hostCapabilities || !!r.hostCapabilities.openLinks;
    applyContext(r.hostContext);
    notify("ui/notifications/initialized", {});
    lastH = -1;
    resize();
  }).catch(() => { /* not an MCP Apps host: window.openai or nothing */ });
})();
</script>
</body>
</html>
