# A Telegram adapter whose plain text routes to the
# static-upstream `assistant` agent. Used to prove a sole TEMPLATE form
# degrades to a copy line instead of entering the legacy numbered-prompt
# (multi-turn) form flow.
version: "0.2"

adapters:
  telegram:
    kind: telegram
    tool: assistant
    inbound:
      kind: webhook
      signature: secret_token
      secret: webhook-secret-for-test
    outbound:
      kind: rest_api
      token: bot-token-for-test
    identity:
      kind: sender_table
      table: '{"42":{"sub":"alice","scopes":["chat"],"tenant":"acme"}}'
    degrade:
      text: passthrough
      narration: passthrough
      buttons: inline_keyboard
      selections: inline_keyboard
      forms: numbered_prompts
      dashboard: rasterised_png
      chips: copy_lines
    rate_limit:
      messages_per_sec: 25
      burst: 50
    correlation_key: correlation-key-for-test

tools:
  assistant:
    surface_components: [text, forms, chips]
