# Issue #200 integration manifest — msteams inline-Report chart images.
# Plain inbound text routes to the static-upstream `assistant` agent,
# which answers with an A2UI surface carrying a `report` component; the
# adapter lifts it into a signed `…/img/{token}` URL that the img route
# fulfils by dispatching `render_report` (peacock) on fetch.
version: "0.2"

adapters:
  msteams:
    kind: ms_teams
    tool: assistant
    inbound:
      kind: webhook
      signature: bot_framework_jwt
      audience: triton-msteams-test-appid
    outbound:
      kind: bot_connector
      client_id: triton-msteams-test-appid
      client_secret: literal-client-secret-for-test
    identity:
      kind: sender_table
      table: '{"29:1abc":{"sub":"alice","scopes":["chat"],"tenant":"acme"}}'
    degrade:
      text: passthrough
      narration: passthrough
      buttons: adaptive_card
      selections: adaptive_card
      forms: adaptive_card
      dashboard: rasterised_png
    rate_limit:
      messages_per_sec: 25
      burst: 50
    correlation_key: correlation-key-for-test

tools:
  echo:
    surface_components: []
  assistant:
    surface_components: []
