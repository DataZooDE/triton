# #288 locality-gate fixture. Identical to
# `manifest-whatsapp-bridge-test.yaml` except the correlation key is an
# `env://` ref left deliberately UNSET, so an adapter that gets PAST the
# bridge-locality gate fails a step later at credential resolution and
# the process exits instead of looping on connect retries. That
# downstream failure is the positive evidence the gate let the address
# through.
#
# WhatsApp adapter using the `socket` inbound (WhatsApp Web bridge)
# instead of the Cloud-API webhook (FR-A-1.v0.2, M-LIFECYCLE-1). The
# bridge daemon terminates the WhatsApp Web session locally; auth is
# the session-locality of the bridge socket, so signature is
# `trusted_socket` and outbound is `socket` (replies go over the
# bridge, not the Graph API — no phone_number_id needed).
version: "0.2"

adapters:
  whatsapp:
    kind: whatsapp_web
    inbound:
      kind: socket
      signature: trusted_socket
    outbound:
      kind: socket
    identity:
      kind: sender_table
      # WhatsApp id (wa-id) → Principal claims.
      table: env://TRITON_WHATSAPP_SENDER_TABLE
    degrade:
      text: passthrough
      narration: passthrough
      buttons: numbered_prompts
      selections: numbered_prompts
      forms: numbered_prompts
      dashboard: rasterised_png
    rate_limit:
      messages_per_sec: 6
      burst: 12
    correlation_key: env://TRITON_WHATSAPP_CORRELATION_KEY

tools:
  echo:
    surface_components: []
