[package]
name = "triton-embed"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
version = "0.0.1"
description = """
Embed Triton's REST/MCP/A2A trio (and optionally the Explorer dev
console) in-process, on a single port, from a `ToolRegistry`. Lets a Rust
agent serve `cargo run` → trio + /explorer with no Consul/Vault. Mirrors
triton-bin's wiring as a library (issue #75, Mode 1).
"""

[dependencies]
triton-config = { path = "../triton-config" }
triton-core = { path = "../triton-core" }
# default-features = false so `--no-default-features` on this crate also
# disables dev-token downstream (ADR-10: never in release).
triton-adapters-http = { path = "../triton-adapters-http", default-features = false }
# The OIDC verifier. Without it this crate can only ever be dev-token-only,
# and a release build (`--no-default-features`) compiles the dev token out —
# so the embedded host would accept NOTHING. See `EmbedOpts::oidc`.
triton-identity = { path = "../triton-identity" }
axum = { workspace = true }
tokio = { workspace = true }
anyhow = "1"
# The ingress group (`ingress.rs`) is the binary's clap group, so a host
# and `triton` parse the same `TRITON_*` variables the same way.
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = "2"

# `chat`: the chat-channel wiring the binary uses (`chat::msteams`) and the
# channel → surface registry (`surfaces`). Off by default: an embedded
# trio host does not compile the chat adapters.
triton-manifest = { path = "../triton-manifest", optional = true }
triton-secrets = { path = "../triton-secrets", optional = true }
triton-chat-telegram = { path = "../triton-chat-telegram", optional = true }
triton-chat-discord = { path = "../triton-chat-discord", optional = true }
triton-chat-whatsapp = { path = "../triton-chat-whatsapp", optional = true }
triton-chat-googlechat = { path = "../triton-chat-googlechat", optional = true }
triton-chat-msteams = { path = "../triton-chat-msteams", optional = true }
triton-chat-signal = { path = "../triton-chat-signal", optional = true }
triton-chat-email = { path = "../triton-chat-email", optional = true }
triton-chat-twilio = { path = "../triton-chat-twilio", optional = true }

# `explorer-assets`: embed the built Flutter SPA and serve it at /explorer.
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

[features]
default = ["dev-token"]
# Accept `Bearer dev-token` when no OIDC issuer is configured. Mirrors
# triton-adapters-http; compiled out in release (`--no-default-features`).
dev-token = ["triton-adapters-http/dev-token"]
# Serve the compiled Explorer SPA at /explorer (requires
# `apps/explorer/build/web` to exist — run `flutter build web` first).
explorer-assets = ["dep:rust-embed", "dep:mime_guess"]
# Dev-only request/response body capture feeding the Trace view. Never in
# release.
capture = ["triton-adapters-http/capture"]
# Chat-channel wiring (`chat`, `surfaces`); see the dependencies above.
chat = [
    "dep:triton-manifest",
    "dep:triton-secrets",
    "dep:triton-chat-telegram",
    "dep:triton-chat-discord",
    "dep:triton-chat-whatsapp",
    "dep:triton-chat-googlechat",
    "dep:triton-chat-msteams",
    "dep:triton-chat-signal",
    "dep:triton-chat-email",
    "dep:triton-chat-twilio",
]

[dev-dependencies]
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { workspace = true }
async-trait = "0.1"
futures = { workspace = true }
# Generate a throwaway RSA keypair in the self-signer wiring test (mirrors
# triton-identity's own signer tests — this module never generates keys itself).
rsa = "0.9"
rand = "0.8"
base64 = "0.22"
